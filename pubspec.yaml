name: uni_ride_application
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.3
  shared_preferences: ^2.5.4
  flutter_localizations:
    sdk: flutter
  intl: any
  provider: ^6.1.5+1
  pin_code_fields: ^9.1.0
  dio: ^5.9.2
  image_picker: ^1.2.1
  permission_handler: ^11.3.1
  onesignal_flutter: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  google_maps_flutter: ^2.7.0
  http: ^1.1.0
  url_launcher: ^6.3.2
  image_cropper: ^12.2.1
  image_cropper_for_web: ^7.0.0
  signalr_netcore: ^1.4.4
  geolocator: ^13.0.1
  flutter_local_notifications: ^18.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  image_path_android: "assets/images/app_logo.png"

  ios: true
  image_path_ios: "assets/images/app_logo.png"

  adaptive_icon_background: "#CF8307"
  adaptive_icon_foreground: "assets/images/app_logo.png"

  min_sdk_android: 21